name: Security

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  actions: read
  security-events: write

jobs:

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Install gosec
        run: |
          # gosec v2.29.0 cannot decode Go 1.27 export data (securego/gosec#1774).
          # Pin the upstream x/tools fix until a compatible tagged release.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261012130337-71577268350e

      - name: Run gosec on main project
        run: |
          go mod download
          gosec -fmt=sarif -out=gosec.main.sarif ./...

      - name: Upload SARIF file
        if: github.event_name != 'pull_request' && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.main.sarif

      - name: Display SARIF results
        if: github.actor == 'nektos/act'
        run: cat gosec.*.sarif
  
  vuln-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on main project
        run: |
          go mod download
          govulncheck ./...
